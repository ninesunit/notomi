# Must match the hostname the app calls. A worker deploys to
# https://<name>.<your-subdomain>.workers.dev, so a name that disagrees with
# EXPO_PUBLIC_R2_WORKER_URL silently publishes to a second worker nobody talks
# to — which is exactly what happened once: the KV namespace, the client secret
# and the Drive routes all landed on "notomi-r2" while the app kept calling
# "notomi".
name = "notomi"
main = "src/index.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]

# Binding used for authenticated uploads, downloads, and deletes.
[[r2_buckets]]
binding = "MATERIALS"
bucket_name = "notomi-materials"

# Refresh tokens for Google Drive, one per Firebase uid.
#
# The id identifies the namespace; it does not grant access to it, which still
# needs a Cloudflare login — so it belongs in the repo. Without this binding the
# /drive/* routes answer 501 and the app falls back to reconnecting Drive by
# hand, which is why a clean clone that lost it lands back on "Connected for
# this session".
#
# Exactly one block. Two with the same binding name is a hard wrangler error.
[[kv_namespaces]]
binding = "DRIVE_TOKENS"
id = "2c94f525b58348248f879c69871da8ae"

[vars]
R2_BUCKET = "notomi-materials"
FIREBASE_PROJECT_ID = "notomii"
# Origins allowed to call this Worker. Add your dev origin while developing.
ALLOWED_ORIGINS = "https://notomii.web.app,https://notomii.firebaseapp.com,http://localhost:8081"
# The public half of the OAuth client. Safe here; the secret half is not.
GOOGLE_CLIENT_ID = "666272925159-qkidb4n2nv4a376qksdnt6vjk4dne6ih.apps.googleusercontent.com"

# The other half of Drive linking is GOOGLE_CLIENT_SECRET, which is a Worker
# secret and never a [vars] entry: anything in [vars] is readable from the
# dashboard and belongs in the repo, and the client secret must be neither.
#
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# Secrets belong to one worker and do not follow a rename, so it has to be set
# against the worker named above.

[observability]
enabled = true
head_sampling_rate = 0.1
