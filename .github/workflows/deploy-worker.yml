name: Deploy R2 Worker

# The Worker is versioned in this repo but deployed to Cloudflare, so a push to
# main is what promotes it. Only worker-related paths trigger a deploy — the
# Expo app shares this repo and changing it has no bearing on the Worker.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# Never let two deploys race; a queued run supersedes the one waiting.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy notomi-r2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          # wrangler-action installs its own wrangler; this keeps CI on the same
          # major version as worker/package.json rather than drifting.
          wranglerVersion: '4'

# ---------------------------------------------------------------------------
# Required repository secrets (Settings > Secrets and variables > Actions):
#
#   CLOUDFLARE_API_TOKEN   Account API token with "Edit Cloudflare Workers".
#                          Create at https://dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  From the Cloudflare dashboard sidebar / R2 overview.
#
# The Worker's own runtime secrets — R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY — are deliberately NOT set here. They are set once with
# `wrangler secret put` and persist across deploys. Pushing them from CI would
# mean an unset or mistyped GitHub secret could silently overwrite a working
# credential with an empty string and break uploads on the next merge.
# ---------------------------------------------------------------------------
